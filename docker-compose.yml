services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-sql-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_sql_assistant
      POSTGRES_USER: app_readonly
      POSTGRES_PASSWORD: app_readonly_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_readonly -d ai_sql_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: ai-sql-assistant-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
